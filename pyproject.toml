[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "searchkit"
version = "1.0.0"
description = "通用多引擎搜索（库 + skill 双形态），16 引擎，无需 API key"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["requests", "html2text", "beautifulsoup4"]

[project.scripts]
searchkit = "search.py:main"

[tool.setuptools]
packages = ["searchkit"]
